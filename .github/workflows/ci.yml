name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install deps
        run: dnf install -y git cmake ninja-build gcc-c++ extra-cmake-modules kf6-kirigami-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel appstream desktop-file-utils util-linux-core dbus-daemon systemd
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate application metadata
        run: |
          desktop-file-validate data/zapret2control.desktop
          appstreamcli validate --no-net data/org.avsprv.zapret2control.metainfo.xml
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Verify systemd units
        run: |
          cmake --install build
          systemd-analyze verify \
            /usr/local/lib/systemd/system/zapret2control-blockcheck.service \
            /usr/local/lib/systemd/system/zapret2control-blockcheck-recovery.service
      - name: Lint QML
        run: cmake --build build --target zapret2control_qmllint
      - name: Test
        run: ctest --test-dir build --output-on-failure

  systemd-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify systemd VM
        run: |
          test "$(ps -p 1 -o comm= | tr -d '[:space:]')" = systemd
          systemctl --version
      - name: Run real Blockcheck lifecycle integration tests
        run: sudo bash tests/test_systemd_lifecycle.sh "$GITHUB_WORKSPACE"
