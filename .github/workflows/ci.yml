name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install deps
        run: dnf install -y git cmake ninja-build gcc-c++ extra-cmake-modules kf6-kirigami-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel appstream desktop-file-utils util-linux-core dbus-daemon systemd
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate application metadata
        run: |
          desktop-file-validate data/zapret2control.desktop
          appstreamcli validate --no-net data/org.avsprv.zapret2control.metainfo.xml
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Verify translation catalog is up to date
        run: |
          cp i18n/zapret2control_en.ts /tmp/zapret2control_en.ts.before
          cmake --build build --target zapret2control_i18n_lupdate
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          def canonical_catalog(path):
              root = ET.parse(path).getroot()

              for element in root.iter():
                  element.attrib.pop("line", None)
                  if element.text is not None and not element.text.strip():
                      element.text = None
                  if element.tail is not None and not element.tail.strip():
                      element.tail = None

              for context in root.findall("context"):
                  for message in context.findall("message"):
                      locations = message.findall("location")
                      other_children = [child for child in message if child.tag != "location"]
                      locations.sort(key=lambda item: tuple(sorted(item.attrib.items())))
                      message[:] = locations + other_children

                  messages = context.findall("message")
                  messages.sort(key=lambda item: ET.tostring(item, encoding="unicode"))
                  other_children = [child for child in context if child.tag != "message"]
                  context[:] = other_children + messages

              contexts = root.findall("context")
              contexts.sort(key=lambda item: item.findtext("name", default=""))
              root[:] = contexts
              return ET.tostring(root, encoding="utf-8")

          before = canonical_catalog("/tmp/zapret2control_en.ts.before")
          after = canonical_catalog("i18n/zapret2control_en.ts")
          if before != after:
              raise SystemExit("Translation catalog differs from current sources")
          PY
      - name: Build
        run: cmake --build build
      - name: Verify systemd units
        run: |
          cmake --install build
          systemd-analyze verify \
            /usr/local/lib/systemd/system/zapret2control-blockcheck.service \
            /usr/local/lib/systemd/system/zapret2control-blockcheck-recovery.service
      - name: Lint QML
        run: cmake --build build --target zapret2control_qmllint
      - name: Test
        run: ctest --test-dir build --output-on-failure

  systemd-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify systemd VM
        run: |
          test "$(ps -p 1 -o comm= | tr -d '[:space:]')" = systemd
          systemctl --version
      - name: Run real Blockcheck lifecycle integration tests
        run: sudo bash tests/test_systemd_lifecycle.sh "$GITHUB_WORKSPACE"
