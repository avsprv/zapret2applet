name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install deps
        run: dnf install -y git cmake ninja-build gcc-c++ extra-cmake-modules kf6-kirigami-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel appstream desktop-file-utils util-linux-core dbus-daemon
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate application metadata
        run: |
          desktop-file-validate data/zapret2control.desktop
          appstreamcli validate --no-net data/org.avsprv.zapret2control.metainfo.xml
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Lint QML
        run: cmake --build build --target zapret2control-qml-preview_qmllint
      - name: Test
        run: ctest --test-dir build --output-on-failure
