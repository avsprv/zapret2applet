name: Packages

on:
  push:
    branches: [main, feature/migrate-qml-kirigami]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deb:
    name: Build DEB (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl debhelper devscripts equivs \
            extra-cmake-modules libkirigami-dev qt6-declarative-dev \
            git ninja-build qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            desktop-file-utils lintian
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install package build dependencies
        run: |
          ln -sfn packaging/debian debian
          mk-build-deps -ir -t "apt-get -y --no-install-recommends" debian/control
      - name: Build DEB
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../zapret2applet_*.deb dist/
      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          lintian -I dist/*.deb
      - name: Smoke-test DEB installation and removal
        run: |
          set -eu
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/*.deb
          test "$(dpkg-query -W -f='${Status}' zapret2applet)" = "install ok installed"
          test -x /usr/bin/zapret2applet
          helper="$(dpkg-query -L zapret2applet | grep '/zapret2applet-helper$')"
          policy="$(dpkg-query -L zapret2applet | grep '/org.zapret2applet.policy$')"
          test -n "$helper" && test -x "$helper"
          test -n "$policy" && test -f "$policy"
          test -f /usr/lib/systemd/system/zapret2applet-blockcheck.service
          test -f /usr/lib/systemd/system/zapret2applet-blockcheck-recovery.service
          DEBIAN_FRONTEND=noninteractive apt-get purge -y zapret2applet
          ! dpkg-query -W zapret2applet >/dev/null 2>&1
          test ! -e /usr/bin/zapret2applet
          test ! -e "$helper"
          test ! -e "$policy"
      - uses: actions/upload-artifact@v4
        with:
          name: zapret2applet-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y ca-certificates cmake curl desktop-file-utils gcc-c++ git \
            extra-cmake-modules kf6-kirigami-devel qt6-qtbase-devel \
            qt6-qtdeclarative-devel qt6-qttools-devel rpm-build rpmlint systemd-rpm-macros tar
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare RPM build tree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          source_dir="$RUNNER_TEMP/zapret2applet-source"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          mkdir -p "$source_dir/third_party"
          cp -a third_party/zapret2 "$source_dir/third_party/zapret2"
          version="$(sed -n 's/^project(zapret2applet VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          tar -czf "$HOME/rpmbuild/SOURCES/zapret2applet-${version}.tar.gz" \
            --transform="s,^,zapret2applet-${version}/," -C "$source_dir" .
          cp packaging/fedora/zapret2applet.spec "$HOME/rpmbuild/SPECS/"
      - name: Build RPM
        run: |
          rpmbuild -ba "$HOME/rpmbuild/SPECS/zapret2applet.spec" \
            --define "_topdir $HOME/rpmbuild"
      - name: Inspect packages
        run: |
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/zapret2applet-*.rpm dist/
          cp "$HOME"/rpmbuild/SRPMS/zapret2applet-*.src.rpm dist/
          rpm -qpl dist/zapret2applet-*.rpm
          rpm -qpR dist/zapret2applet-*.rpm
          rpmlint dist/*.rpm
      - name: Smoke-test RPM installation and removal
        run: |
          set -eu
          package=""
          for candidate in dist/zapret2applet-[0-9]*.x86_64.rpm; do
            [ -f "$candidate" ] || continue
            package="$candidate"
            break
          done
          test -n "$package"
          test "$(rpm -qp --qf '%{NAME}' "$package")" = "zapret2applet"
          test "$(rpm -qp --qf '%{ARCH}' "$package")" = "x86_64"
          dnf install -y "$package"
          rpm -q zapret2applet
          test -x /usr/bin/zapret2applet
          helper="$(rpm -ql zapret2applet | grep '/zapret2applet-helper$')"
          policy="$(rpm -ql zapret2applet | grep '/org.zapret2applet.policy$')"
          test -n "$helper" && test -x "$helper"
          test -n "$policy" && test -f "$policy"
          test -f /usr/lib/systemd/system/zapret2applet-blockcheck.service
          test -f /usr/lib/systemd/system/zapret2applet-blockcheck-recovery.service
          dnf remove -y zapret2applet
          ! rpm -q zapret2applet >/dev/null 2>&1
          test ! -e /usr/bin/zapret2applet
          test ! -e "$helper"
          test ! -e "$policy"
      - uses: actions/upload-artifact@v4
        with:
          name: zapret2applet-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30
