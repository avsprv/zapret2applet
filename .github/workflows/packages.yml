name: Packages

on:
  push:
    branches: [main, feature/migrate-qml-kirigami, feature/rename-zapret2control]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deb:
    name: Build DEB (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl debhelper devscripts equivs \
            extra-cmake-modules libkirigami-dev qt6-declarative-dev \
            git ninja-build qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            desktop-file-utils lintian dbus-daemon
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install package build dependencies
        run: |
          ln -sfn packaging/debian debian
          mk-build-deps -ir -t "apt-get -y --no-install-recommends" debian/control
      - name: Build DEB
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../zapret2control_*.deb dist/
      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          lintian -I dist/*.deb
      - name: Remove build-only Qt development dependencies before runtime smoke test
        run: |
          set -eux
          apt-get purge -y zapret2control-build-deps build-essential cmake debhelper devscripts equivs \
            extra-cmake-modules libkirigami-dev qt6-declarative-dev qt6-base-dev qt6-tools-dev \
            qt6-l10n-tools ninja-build desktop-file-utils lintian
          apt-get autoremove -y
      - name: Smoke-test DEB clean installation and removal
        run: |
          set -eux
          control_dir="$RUNNER_TEMP/zapret2control-deb-control"
          mkdir -p "$control_dir"
          dpkg-deb --control dist/*.deb "$control_dir"
          echo '--- generated postinst ---'
          cat "$control_dir/postinst"
          echo '--- generated postrm ---'
          cat "$control_dir/postrm"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/*.deb
          test "$(dpkg-query -W -f='${Status}' zapret2control)" = "install ok installed"
          test -x /usr/bin/zapret2control
          sh tests/test_qml_startup.sh /usr/bin/zapret2control
          helper="$(dpkg-query -L zapret2control | grep '/zapret2control-helper$')"
          policy="$(dpkg-query -L zapret2control | grep '/org.zapret2control.policy$')"
          test -n "$helper" && test -x "$helper"
          test -n "$policy" && test -f "$policy"
          test -f /usr/lib/systemd/system/zapret2control-blockcheck.service
          test -f /usr/lib/systemd/system/zapret2control-blockcheck-recovery.service
          test -f /usr/share/zapret2control/blockcheck_admission.py
          dpkg-query -L zapret2control | grep -Eq "^/usr/share/man/man1/zapret2control\\.1(\\.gz)?$"
          DEBIAN_FRONTEND=noninteractive apt-get purge -y zapret2control
          ! dpkg-query -W zapret2control >/dev/null 2>&1
          test ! -e /usr/bin/zapret2control
          test ! -e "$helper"
          test ! -e "$policy"
          test ! -e /usr/share/zapret2control/blockcheck_admission.py
          test ! -e /usr/share/man/man1/zapret2control.1 && test ! -e /usr/share/man/man1/zapret2control.1.gz
      - uses: actions/upload-artifact@v6
        with:
          name: zapret2control-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y ca-certificates cmake curl desktop-file-utils gcc-c++ git \
            extra-cmake-modules kf6-kirigami-devel qt6-qtbase-devel \
            qt6-qtdeclarative-devel qt6-qttools-devel rpm-build rpmlint systemd-rpm-macros tar dbus-daemon
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare RPM build tree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          source_dir="$RUNNER_TEMP/zapret2control-source"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          mkdir -p "$source_dir/third_party"
          cp -a third_party/zapret2 "$source_dir/third_party/zapret2"
          version="$(sed -n 's/^project(zapret2control VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          tar -czf "$HOME/rpmbuild/SOURCES/zapret2control-${version}.tar.gz" \
            --transform="s,^,zapret2control-${version}/," -C "$source_dir" .
          cp packaging/fedora/zapret2control.spec "$HOME/rpmbuild/SPECS/"
      - name: Build RPM
        run: |
          rpmbuild -ba "$HOME/rpmbuild/SPECS/zapret2control.spec" \
            --define "_topdir $HOME/rpmbuild"
      - name: Inspect packages
        run: |
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/zapret2control-*.rpm dist/
          cp "$HOME"/rpmbuild/SRPMS/zapret2control-*.src.rpm dist/
          rpm -qpl dist/zapret2control-*.rpm
          rpm -qpR dist/zapret2control-*.rpm
          rpmlint dist/*.rpm
      - name: Remove build-only Qt development dependencies before runtime smoke test
        run: |
          set -eux
          dnf remove -y cmake extra-cmake-modules kf6-kirigami-devel qt6-qtbase-devel \
            qt6-qtdeclarative-devel qt6-qttools-devel rpm-build rpmlint gcc-c++ \
            desktop-file-utils systemd-rpm-macros
          dnf autoremove -y
      - name: Smoke-test RPM clean installation and removal
        run: |
          set -eux
          package=""
          for candidate in dist/zapret2control-[0-9]*.x86_64.rpm; do
            [ -f "$candidate" ] || continue
            package="$candidate"
            break
          done
          test -n "$package"
          test "$(rpm -qp --qf '%{NAME}' "$package")" = "zapret2control"
          test "$(rpm -qp --qf '%{ARCH}' "$package")" = "x86_64"
          dnf install -y "$package"
          rpm -q zapret2control
          echo '--- installed application metadata ---'
          ls -l /usr/bin/zapret2control
          stat /usr/bin/zapret2control
          rpm -qf /usr/bin/zapret2control
          rpm -q --qf '[%{FILENAMES} %{FILEMODES:perms}\\n]' zapret2control
          test -x /usr/bin/zapret2control
          sh tests/test_qml_startup.sh /usr/bin/zapret2control
          helper="$(rpm -ql zapret2control | grep '/zapret2control-helper$')"
          policy="$(rpm -ql zapret2control | grep '/org.zapret2control.policy$')"
          test -n "$helper" && test -x "$helper"
          test -n "$policy" && test -f "$policy"
          test -f /usr/lib/systemd/system/zapret2control-blockcheck.service
          test -f /usr/lib/systemd/system/zapret2control-blockcheck-recovery.service
          test -f /usr/share/zapret2control/blockcheck_admission.py
          rpm -ql zapret2control | grep -Eq "^/usr/share/man/man1/zapret2control\\.1(\\.gz)?$"
          dnf remove -y zapret2control
          ! rpm -q zapret2control >/dev/null 2>&1
          test ! -e /usr/bin/zapret2control
          test ! -e "$helper"
          test ! -e "$policy"
          test ! -e /usr/share/zapret2control/blockcheck_admission.py
          test ! -e /usr/share/man/man1/zapret2control.1 && test ! -e /usr/share/man/man1/zapret2control.1.gz
      - uses: actions/upload-artifact@v6
        with:
          name: zapret2control-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30
